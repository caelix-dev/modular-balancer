[tips-and-tricks-item-description]
mb-tips=[entity=mb-balancer-basic] Modular balancer blocks join edge to edge into one balancer of any shape. Every belt pointing straight into a block is an input, every belt leaving one straight is an output, and every output gets exactly the same share.\n\nClick a block to open its balancer's settings and the block's own filter. The numbers in these simulations are what each output lane carries per second.
mb-tips-basic=Place blocks of one tier next to each other and attach belts. Any number of inputs and outputs works, not only powers of two: here 2 full belts go into 3 outputs, and each output gets a third of the input.\n\nWhen some outputs back up, the others still share equally, and the inputs are drawn equally. Inserters taking from a block count as one more output.
mb-tips-lanes=By default every lane is balanced on its own: an input that fills only the left lane gives outputs with only the left lane (top).\n\nWith [font=default-semibold]Balance lanes[/font] on, both lanes of every output carry the same, whatever lanes the inputs use (bottom).
mb-tips-recirc=Here one output is blocked.\n\nWith [font=default-semibold]Redistribute unused shares[/font] off, the blocked output's share goes to one neighbouring output only, so the outputs are no longer equal (top).\n\nOn (the default), what an output does not take goes back into the balancer, and the other outputs keep equal shares (bottom). Off uses a smaller hidden network that costs less game update time; the outputs are still equal while they all run freely.
mb-tips-filters=Every block has its own item filter, laid out as an inserter's. It applies to that block's outputs, but the whole balancer routes by it.\n\nWith a whitelist, the block's outputs take only the listed items, and those items go only to blocks that list them, as with a filter splitter. The other outputs share everything else. Here the top block takes copper plates, the other two share the iron.\n\nBlocks show their filter in alt mode.
mb-tips-lane-filters=With [font=default-semibold]Per lane[/font], slot 1 goes on the left lane of the block's outputs and slot 2 on the right lane. A mixed belt comes out sorted: iron on the left, copper on the right.\n\nA lane whose slot is empty takes every item the other slot does not.
mb-tips-half-belt=A per lane filter whose slot 1 holds an item that never comes on this belt, for example a deconstruction planner, leaves the left lane empty: every item goes on the right lane.\n\nA full belt then comes out as half a belt, on one lane (bottom). Without the filter it passes whole (top). The input backs up, so only half a belt is taken from it.

