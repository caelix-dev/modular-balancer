[mod-name]
modular-balancer=Modular Balancer

[mod-description]
modular-balancer=1x1 balancer blocks. Edge-connected blocks of one tier form one exact N:M belt balancer: every belt pointing into a block is an input, every belt leaving one is an output.

[entity-name]
mb-balancer-basic=Modular balancer
mb-balancer-fast=Fast modular balancer
mb-balancer-express=Express modular balancer
mb-balancer-turbo=Turbo modular balancer

[entity-description]
mb-balancer-basic=Blocks of the same tier joined edge to edge form one balancer. Belts pointing into the blocks are inputs, belts leaving them are outputs, and every output gets an equal share.
mb-balancer-fast=Blocks of the same tier joined edge to edge form one balancer. Belts pointing into the blocks are inputs, belts leaving them are outputs, and every output gets an equal share.
mb-balancer-express=Blocks of the same tier joined edge to edge form one balancer. Belts pointing into the blocks are inputs, belts leaving them are outputs, and every output gets an equal share.
mb-balancer-turbo=Blocks of the same tier joined edge to edge form one balancer. Belts pointing into the blocks are inputs, belts leaving them are outputs, and every output gets an equal share.

[mb-message]
curved=Balancer: the last belt tile into a block must be straight
side-loaded=Balancer: a belt leaving a block cannot be side-loaded; it is not an output
two-unswappable=Balancer: a block takes only one underground belt, splitter or other non-belt neighbour
inserter-both=Balancer: inserters both put into and take from this block; it is ignored
port-tile-taken=Balancer: a block with an underground belt or splitter neighbour cannot also serve inserters
no-free-side=Balancer: no free side for this block's inserter port
other-force=Balancer: a belt of another force, or between balancers of different forces, is ignored
belt-on-block=A belt cannot be built on a balancer block
block-on-belt=A balancer block cannot be built on a belt
too-many-items=Balancer: too many items to rebuild; the old balancer is kept
rebuild-failed=Balancer: could not be rebuilt; the old balancer is kept
wired-belt=Balancer: this block already uses its tile for another belt; a wired or circuit-controlled belt cannot be connected here
tier-removed=Balancer: __1__ blocks of a tier that no longer exists were replaced by __2__ blocks; their items were kept
