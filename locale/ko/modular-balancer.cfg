[mod-name]
modular-balancer=모듈식 밸런서

[mod-description]
modular-balancer=1x1 밸런서 블록입니다. 같은 등급의 블록을 변끼리 붙이면 하나의 정확한 N:M 벨트 밸런서가 됩니다. 블록으로 들어오는 벨트는 모두 입력이 되고, 블록에서 나가는 벨트는 모두 출력이 됩니다.

[entity-name]
mb-balancer-basic=모듈식 밸런서
mb-balancer-fast=빠른 모듈식 밸런서
mb-balancer-express=고속 모듈식 밸런서
mb-balancer-turbo=터보 모듈식 밸런서

[entity-description]
mb-balancer-basic=같은 등급의 블록을 변끼리 붙이면 하나의 밸런서가 됩니다. 블록으로 들어오는 벨트는 입력, 블록에서 나가는 벨트는 출력이 되며, 모든 출력이 똑같이 나눠 받습니다.
mb-balancer-fast=같은 등급의 블록을 변끼리 붙이면 하나의 밸런서가 됩니다. 블록으로 들어오는 벨트는 입력, 블록에서 나가는 벨트는 출력이 되며, 모든 출력이 똑같이 나눠 받습니다.
mb-balancer-express=같은 등급의 블록을 변끼리 붙이면 하나의 밸런서가 됩니다. 블록으로 들어오는 벨트는 입력, 블록에서 나가는 벨트는 출력이 되며, 모든 출력이 똑같이 나눠 받습니다.
mb-balancer-turbo=같은 등급의 블록을 변끼리 붙이면 하나의 밸런서가 됩니다. 블록으로 들어오는 벨트는 입력, 블록에서 나가는 벨트는 출력이 되며, 모든 출력이 똑같이 나눠 받습니다.

[mb-message]
curved=밸런서: 블록으로 들어가는 마지막 벨트 칸은 곧아야 합니다
side-loaded=밸런서: 블록에서 나가는 벨트에는 옆에서 합류할 수 없습니다. 출력으로 쓰지 않습니다
two-unswappable=밸런서: 블록 하나에는 지하 벨트, 분배기 같은 벨트가 아닌 이웃을 하나만 붙일 수 있습니다
inserter-both=밸런서: 이 블록에 넣는 투입기와 꺼내는 투입기가 함께 있어 무시합니다
port-tile-taken=밸런서: 지하 벨트, 분배기 또는 회로선이 연결된 벨트가 붙은 블록은 투입기를 함께 쓸 수 없습니다
no-free-side=밸런서: 이 블록의 투입기 포트를 둘 빈 면이 없습니다
other-force=밸런서: 다른 세력의 벨트, 또는 다른 세력 밸런서 사이의 벨트는 무시합니다
belt-on-block=밸런서 블록 위에는 벨트를 지을 수 없습니다
block-on-belt=벨트 위에는 밸런서 블록을 지을 수 없습니다
drain-stuck=밸런서: 다시 지었지만 버퍼가 가득 차서 기존 밸런서의 아이템 일부가 자리가 날 때까지 안에서 기다립니다 (아이템은 사라지지 않습니다)
rebuild-failed=밸런서: 다시 지을 수 없어 기존 밸런서와 설정을 유지합니다
wired-belt=밸런서: 이 블록은 이미 다른 벨트에 칸을 쓰고 있어 회로선이나 회로 조건이 있는 벨트를 연결할 수 없습니다
tier-removed=밸런서: 더 이상 없는 등급의 블록 __1__개를 __2__ 블록으로 바꿨습니다. 안의 아이템은 그대로입니다

[mb-gui]
title=밸런서
ratio=입력 __1__개, 출력 __2__개
idle=연결되지 않음 (입력과 출력이 하나 이상씩 필요)
ghost=아직 건설되지 않음: 이 설정은 건설될 때 적용됩니다
balance-lanes=레인 균등 분배
balance-lanes-tooltip=입력이 한쪽 레인만 채워도 모든 출력의 두 레인에 같은 양이 나갑니다. 바꾸면 밸런서를 다시 짓고, 아이템은 그대로 남습니다.
recirc=남는 몫 되돌려 보내기
recirc-tooltip=어떤 출력이 가져가지 않은 몫을 밸런서로 되돌려 나머지 출력이 계속 같게 받습니다. 끄면 게임 업데이트 시간이 덜 드는 작은 네트워크를 쓰지만, 느린 출력의 몫이 옆 출력 하나로만 갑니다. 바꾸면 밸런서를 다시 짓고, 아이템은 그대로 남습니다.
filter-tooltip=이 블록만의 필터로, 이 블록의 출력(벨트와 투입기)에 적용됩니다. 밸런서의 다른 블록은 각자의 필터를 씁니다. 필터 분배기처럼, 지정한 아이템은 그 아이템을 지정한 블록으로만 가고 나머지는 다른 출력들이 나눠 받습니다. 같은 아이템을 지정한 블록이 여럿이면 똑같이 나눠 받습니다. 어떤 출력도 받지 않는 아이템은 입력에서 기다리며 그 입력을 막습니다. 바꾸면 밸런서를 다시 짓고, 아이템은 그대로 남습니다.
filter-mode-tooltip=제외 목록: 이 블록의 출력은 지정한 아이템을 뺀 나머지를 모두 받습니다 (다른 블록의 필터가 가져가는 아이템도 빠집니다).
filter-lanes=레인별 필터
filter-lanes-tooltip=1번 슬롯은 이 블록 출력의 왼쪽 레인으로, 2번 슬롯은 오른쪽 레인으로 나갑니다. 슬롯이 빈 레인으로는 나머지 아이템이 나갑니다. 켜져 있는 동안 3~5번 슬롯, 허용 목록/제외 목록, 그리고 이 블록 창의 레인 균등 분배는 값을 유지한 채 잠깁니다.
slot-left=왼쪽 레인
slot-right=오른쪽 레인

[tips-and-tricks-item-name]
mb-tips=모듈식 밸런서
mb-tips-basic=밸런싱
mb-tips-lanes=레인 균등 분배
mb-tips-recirc=남는 몫 되돌려 보내기
mb-tips-filters=필터
mb-tips-lane-filters=레인별 필터
mb-tips-half-belt=레인별 필터로 반 벨트만 뽑기

[tips-and-tricks-item-description]
mb-tips=[entity=mb-balancer-basic] 모듈식 밸런서 블록을 변끼리 붙이면 어떤 모양이든 하나의 밸런서가 됩니다. 블록으로 곧게 들어가는 벨트는 모두 입력, 블록에서 곧게 나가는 벨트는 모두 출력이 되고, 모든 출력이 정확히 똑같이 나눠 받습니다.\n\n블록을 클릭하면 밸런서 설정과 그 블록의 필터를 열 수 있습니다. 이 시뮬레이션의 숫자는 각 출력 레인이 초당 나르는 양입니다.
mb-tips-basic=같은 등급의 블록을 나란히 놓고 벨트를 붙이세요. 입력과 출력은 2의 거듭제곱이 아니어도 몇 개든 됩니다. 여기서는 가득 찬 벨트 2개가 출력 3개로 들어가고, 출력마다 입력의 3분의 1씩 받습니다.\n\n일부 출력이 막혀도 나머지 출력은 계속 똑같이 나눠 받고, 입력도 똑같이 끌어옵니다. 블록에서 꺼내는 투입기는 출력 하나로 칩니다.
mb-tips-lanes=기본으로는 레인마다 따로 나눕니다. 입력이 왼쪽 레인만 채우면 출력도 왼쪽 레인만 채웁니다 (위).\n\n[font=default-semibold]레인 균등 분배[/font]를 켜면 입력이 어느 레인을 쓰든 모든 출력의 두 레인에 같은 양이 나갑니다 (아래).
mb-tips-recirc=여기서는 출력 하나가 막혀 있습니다.\n\n[font=default-semibold]남는 몫 되돌려 보내기[/font]를 끄면 막힌 출력의 몫이 옆 출력 하나로만 가서 출력들이 더 이상 같지 않습니다 (위).\n\n켜면 (기본값) 어떤 출력이 가져가지 않은 몫이 밸런서로 되돌아가 나머지 출력이 계속 똑같이 받습니다 (아래). 끄면 게임 업데이트 시간이 덜 드는 작은 숨은 네트워크를 쓰고, 모든 출력이 막힘 없이 흐를 때는 여전히 똑같이 받습니다.
mb-tips-filters=블록마다 투입기와 같은 모양의 아이템 필터가 있습니다. 필터는 그 블록의 출력에 적용되지만, 밸런서 전체가 이 필터에 따라 아이템을 보냅니다.\n\n허용 목록이면 그 블록의 출력은 지정한 아이템만 받고, 지정한 아이템은 필터 분배기처럼 그 아이템을 지정한 블록으로만 갑니다. 나머지 출력은 그 밖의 아이템을 나눠 받습니다. 여기서는 맨 위 블록이 구리판을 받고, 나머지 두 블록이 철판을 나눠 받습니다.\n\nAlt 모드에서는 블록에 필터가 표시됩니다.
mb-tips-lane-filters=[font=default-semibold]레인별 필터[/font]를 켜면 1번 슬롯은 블록 출력의 왼쪽 레인으로, 2번 슬롯은 오른쪽 레인으로 나갑니다. 섞인 벨트가 정리되어 나옵니다: 왼쪽은 철판, 오른쪽은 구리판.\n\n슬롯이 빈 레인으로는 다른 슬롯이 가져가지 않는 아이템이 모두 나갑니다.
mb-tips-half-belt=레인별 필터의 1번 슬롯에 이 벨트로 절대 들어오지 않는 아이템(예: 해체 계획기)을 넣으면 왼쪽 레인은 비고, 모든 아이템이 오른쪽 레인으로 나갑니다.\n\n그러면 가득 찬 벨트가 한 레인짜리 반 벨트로 나옵니다 (아래). 필터가 없으면 벨트가 그대로 통과합니다 (위). 입력은 밀려서 반 벨트만큼만 가져갑니다.

[mb-tips]
lanes-off=레인 균등 분배: 끔
lanes-on=레인 균등 분배: 켬
recirc-off=남는 몫 되돌려 보내기: 끔
recirc-on=남는 몫 되돌려 보내기: 켬
blocked=막힘
half-off=필터 없음
half-on=레인별 필터: 1번 = [item=deconstruction-planner], 2번 비움
