[mod-name]
modular-balancer=모듈식 밸런서

[mod-description]
modular-balancer=1x1 밸런서 블록입니다. 같은 등급의 블록을 변끼리 붙이면 하나의 정확한 N:M 벨트 밸런서가 됩니다. 블록으로 들어오는 벨트는 모두 입력이 되고, 블록에서 나가는 벨트는 모두 출력이 됩니다.

[entity-name]
mb-balancer-basic=모듈식 밸런서
mb-balancer-fast=빠른 모듈식 밸런서
mb-balancer-express=고속 모듈식 밸런서
mb-balancer-turbo=터보 모듈식 밸런서

[entity-description]
mb-balancer-basic=같은 등급의 블록을 변끼리 붙이면 하나의 밸런서가 됩니다. 블록으로 들어오는 벨트는 입력, 블록에서 나가는 벨트는 출력이 되며, 모든 출력이 똑같이 나눠 받습니다.
